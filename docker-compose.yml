services:
  postgres:
    image: postgres:16-alpine
    container_name: beyondwalls-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: beyondwalls
      POSTGRES_PASSWORD: beyondwalls
      POSTGRES_DB: beyondwalls
    ports:
      - "5432:5432"
    volumes:
      - beyondwalls-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beyondwalls -d beyondwalls"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  beyondwalls-pgdata:

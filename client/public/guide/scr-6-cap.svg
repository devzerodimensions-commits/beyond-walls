<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360">
  <rect width="480" height="360" fill="#F5F3EE"/>
  <!-- All four in, a cap over each head. -->
  <rect x="100" y="132" width="256" height="146" fill="#1F1F1F" stroke="#111111" stroke-width="2"/>
  <g stroke="#EDE9E0" stroke-width="9" stroke-linecap="round">
    <path d="M130 190 H288"/>
  </g>
  <g stroke="#8F8F8F" stroke-width="6" stroke-linecap="round">
    <path d="M130 222 H234"/>
  </g>
  <g fill="#E4E1DB" stroke="#F5F3EE" stroke-width="1.6">
    <circle cx="124" cy="156" r="10"/>
    <circle cx="124" cy="254" r="10"/>
    <circle cx="332" cy="254" r="10"/>
  </g>
  <!-- the last head, still bare -->
  <circle cx="332" cy="156" r="10" fill="#4A4A4A" stroke="#F5F3EE" stroke-width="1.6"/>
  <path d="M326 156 H338" stroke="#111111" stroke-width="2"/>
  <!-- its cap, coming down -->
  <circle cx="420" cy="86" r="18" fill="#E4E1DB" stroke="#0E7A57" stroke-width="2.4"/>
  <path d="M410 78 a13 13 0 0 1 14 -4" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <g stroke="#0E7A57" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M404 104 L352 142"/>
    <path d="M353 128 L352 142 L366 141"/>
  </g>
</svg>

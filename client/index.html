    <!--
      The shell's own title and description, for whoever reads this page
      without running it: a search crawler, and the preview card a link gets in
      WhatsApp. React replaces both on mount from Settings → SEO, so a visitor
      sees the live values — but a crawler often sees only what is written here.

      This was the wording the studio objected to: "we do not want our website
      communication like this. We are not only selling Name plates & signages."
      Settings was corrected at the time and this copy was missed, so the one
      version that reaches a link preview went on saying it. The words below are
      their own, and match what Settings holds.
    -->
    <title>Beyond Walls — A design-led brand for your spaces</title>
    <meta
      name="description"
      content="Beyond Walls is a contemporary home &amp; lifestyle brand creating thoughtfully designed objects for spaces that feel like yours. Made to order in Ahmedabad."
    />
  </head>

    <div id="root"></div>

  </body>

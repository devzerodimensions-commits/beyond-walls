# Beyond Walls on Render
# ---------------------------------------------------------------------------
# One web service and one PostgreSQL database.
#
# The service hosts the storefront, the admin panel and the API together on a
# single origin. That is deliberate: the refresh token is an HttpOnly
# SameSite=Strict cookie, and a browser will not send that across origins. Split
# the site onto a separate static host and every customer is silently signed out
# fifteen minutes after logging in.
#
# To deploy: Render Dashboard -> New -> Blueprint -> pick this repository.
# Render reads this file, creates both resources and asks for the values marked
# sync:false below.
# ---------------------------------------------------------------------------

databases:
  - name: beyondwalls-db
    databaseName: beyondwalls
    user: beyondwalls
    # The free database is removed after 30 days and cannot be backed up.
    # Change to `basic-256mb` (or higher) before taking real orders.
    plan: free
    # Only the web service may connect; nothing is exposed to the internet.
    ipAllowList: []

services:
  - type: web
    name: beyondwalls
    runtime: node
    plan: free # See "Before you sell from it" in DEPLOYMENT.md — free instances sleep.
    region: singapore # Closest Render region to Ahmedabad.
    branch: main

    # postinstall runs `prisma generate`; build:deploy applies migrations and
    # then compiles the server and the client.
    # FIRST DEPLOY ONLY: seed the empty free database because Render's free
    # service has no Shell access. Remove `&& npm run seed` after the first
    # successful deploy so future deploys never touch admin-edited content.
    buildCommand: npm ci && npm run build:deploy && npm run seed
    startCommand: npm start

    # Render restarts the service if this stops answering. It is exempt from
    # rate limiting, so a health check can never throttle itself out of rotation.
    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production

      - key: DATABASE_URL
        fromDatabase:
          name: beyondwalls-db
          property: connectionString

      # --- Secrets: generated once by Render, never seen by anyone ----------
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d

      # --- URLs -------------------------------------------------------------
      # Site and API share one origin, so both point at this service.
      #
      # These must include https://. They are concatenated into password reset
      # links, order emails and canonical tags, so a bare hostname produces a
      # link that does not work. (The server now corrects a missing scheme and
      # logs a warning, but set it properly here.)
      #
      # Render appends a suffix if the name "beyondwalls" is already taken, and
      # it tells you the real URL after the first deploy. Correct these two and
      # your own domain goes here once it is attached in Render -> Settings.
      - key: PUBLIC_SITE_URL
        value: https://beyondwalls.onrender.com
      - key: API_BASE_URL
        value: https://beyondwalls.onrender.com
      # Same-origin means there is no cross-origin request to allow.
      - key: CORS_ORIGINS
        value: ""

      # Render terminates TLS at its proxy. Without this the server sees every
      # request as coming from the proxy: rate limiting counts all customers as
      # one visitor, and secure cookies are refused.
      - key: TRUST_PROXY
        value: "true"

      # --- Where the built site is served from ------------------------------
      - key: CLIENT_DIST
        value: /opt/render/project/src/client/dist

      # --- Uploads ----------------------------------------------------------
      # Render's filesystem is rebuilt on every deploy, so anything uploaded
      # through the admin panel would vanish. Cloudinary's free tier keeps them
      # and serves them over a CDN. Until these are filled in the server falls
      # back to local disk and says so in the log.
      - key: STORAGE_DRIVER
        value: cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: MAX_UPLOAD_MB
        value: "10"

      # --- Razorpay ---------------------------------------------------------
      # Leave blank to launch with cash on delivery only. The storefront hides
      # every online-payment claim until real keys are present.
      # Webhook URL: https://<your-domain>/api/webhooks/razorpay
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAY_CURRENCY
        value: INR

      # --- Email ------------------------------------------------------------
      # Without these, order confirmations and password resets are written to
      # the log instead of being sent. A password reset link that never arrives
      # is a locked-out customer, so fill these in before launch.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        value: "Beyond Walls <info@beyondwall.in>"
      # Where custom-order enquiries are sent. These are sales leads — if this
      # is blank they are only visible inside the admin panel.
      - key: ADMIN_NOTIFICATION_EMAIL
        value: info@beyondwall.in

      # --- First admin account ---------------------------------------------
      # Used only by `npm run seed`. Set a real password here BEFORE seeding —
      # the one in the README is public.
      - key: SEED_ADMIN_EMAIL
        value: info@beyondwall.in
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_ADMIN_NAME
        value: Beyond Walls Admin

      # --- Rate limiting ----------------------------------------------------
      - key: RATE_LIMIT_WINDOW_MINUTES
        value: "15"
      - key: RATE_LIMIT_MAX
        value: "600"
      # Sign-in attempts per IP. Raise it if customers share an address, such as
      # an office or a mobile carrier's NAT.
      - key: AUTH_RATE_LIMIT_MAX
        value: "30"
